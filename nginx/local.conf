# ============================================================
# 로컬 개발 전용 nginx 설정 (docker-compose.local.yml 에서 사용)
#
# 실서버(dev / prod) 설정으로 사용하지 않습니다.
# HTTPS, 캐시, gzip, 보안 헤더 등 운영에 필요한 설정은 포함되어 있지 않습니다.
# ============================================================

upstream django_local {
    # 호스트에서 실행 중인 runserver
    server host.docker.internal:8000;
}

server {
    listen 80;
    server_name localhost;

    # /register → /register/ 리다이렉트 시 컨테이너 내부 포트(80)가 아닌
    # 브라우저가 접속한 주소(localhost:8080) 기준의 상대 경로로 보낸다.
    absolute_redirect off;

    # 개발 중 수정한 web/ 파일이 바로 반영되도록 브라우저 캐시를 끈다.
    add_header Cache-Control "no-store";

    # 프론트엔드 (web/)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Django: API / Admin / Admin·DRF 정적 파일
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django_local;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
